version: v1
linters:
  default: STANDARD
  enable: [COMMENTS, UNARY_RPC]
linters-settings:
  ENUM_ZERO_VALUE_SUFFIX:
    suffix: NONE
  SERVICE_SUFFIX:
    suffix: API
issues:
  exclude-rules:
    - path: testdata
    - path: wellknownimports
    - path: examples/generated
breaking:
  baseline: git:main
  categories: [FILE]
  ignore: [testdata, wellknownimports, examples/generated]
