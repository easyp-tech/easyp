syntax = "proto3";
package audit.iter2.nested;

message Container {
    message SubItem {
        int32 sub_id = 1;
        string detail = 2;
    }
    enum Status {
        UNKNOWN = 0;
        ACTIVE = 1;
        RETIRED = 2;
    }
    SubItem item = 1;
    Status status = 2;
    oneof payload {
        string text_payload = 10;
        int64 num_payload = 11;
    }
    optional string opt_name = 12;
}
