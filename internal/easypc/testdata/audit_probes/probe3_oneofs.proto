syntax = "proto3";

package test.audit.oneofs;

message OneofOrderingProbe {
  string regular_first = 1;

  oneof explicit_choice_alpha {
    string choice_a1 = 2;
    int32 choice_a2 = 3;
  }

  optional string synthetic_opt_first = 4;

  oneof explicit_choice_beta {
    bool choice_b1 = 5;
    bytes choice_b2 = 6;
  }

  optional int64 synthetic_opt_second = 7;
}
