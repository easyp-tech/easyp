syntax = "proto3";

package audit.probes.options;

import "google/protobuf/descriptor.proto";

enum AuditLevel {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_LOW = 1;
  LEVEL_HIGH = 2;
  LEVEL_FORENSIC = 3;
}

message AuditMetadata {
  string auditor = 1;
  int32 revision = 2;
  repeated string tags = 3;
}

extend google.protobuf.FileOptions {
  string file_audit_marker = 60001;
}

extend google.protobuf.MessageOptions {
  AuditLevel message_level = 60002;
  AuditMetadata message_metadata = 60003;
}

extend google.protobuf.FieldOptions {
  int32 field_score = 60004;
  repeated int32 field_thresholds = 60005;
}

extend google.protobuf.EnumOptions {
  bool enum_verified = 60006;
}

extend google.protobuf.MethodOptions {
  string method_security = 60007;
}
