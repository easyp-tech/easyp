syntax = "proto2";
package tier3.combo18;
import "google/protobuf/descriptor.proto";

extend google.protobuf.FileOptions { optional string file_tag = 50318; }
extend google.protobuf.MessageOptions { optional int32 msg_tag = 50319; }
extend google.protobuf.FieldOptions { optional bool field_tag = 50320; }

option (file_tag) = "v1";

message OptionedMsg {
  option (msg_tag) = 42;
  optional string val = 1 [(field_tag) = true];
}
