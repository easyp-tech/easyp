syntax = "proto2";
package tier3.combo20;
import "google/protobuf/descriptor.proto";

extend google.protobuf.EnumValueOptions {
  optional string code_name = 50321;
}

enum NegativeEnumWithOpts {
  NEG_ERR = -1 [(code_name) = "ERROR"];
  NO_ERR = 0 [(code_name) = "OK"];
  WARN_ERR = 1 [(code_name) = "WARN"];
}

message EnumUser {
  optional NegativeEnumWithOpts status = 1 [default = NO_ERR];
}
