syntax = "proto2";
package tier3.combo23;
import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  optional string migration_guide = 50323;
}

message DeprecatedMsg {
  optional string old_field = 1 [deprecated = true, (migration_guide) = "use new_field"];
  optional string new_field = 2;
}
