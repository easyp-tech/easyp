syntax = "proto3";
package tier3.combo30;
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_HIGH = 2;
}

// Master composite message exercising full protobuf capabilities
message MasterBlend {
  int64 id = 1;
  string title = 2 [json_name = "taskTitle"];
  Priority priority = 3;
  google.protobuf.Timestamp created_at = 4;
  map<string, string> metadata = 5;
  oneof payload {
    string raw_text = 6;
    google.protobuf.Any custom_data = 7;
  }
}

message BlendResponse {
  bool success = 1;
  MasterBlend item = 2;
}

service TaskWorkflowService {
  rpc ProcessTask (MasterBlend) returns (BlendResponse);
}
