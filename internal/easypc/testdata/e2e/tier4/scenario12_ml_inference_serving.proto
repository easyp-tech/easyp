syntax = "proto3";
package ml.serving.v1;

enum DataType {
  DT_INVALID = 0;
  DT_FLOAT = 1;
  DT_DOUBLE = 2;
  DT_INT32 = 3;
  DT_INT64 = 4;
  DT_BYTES = 5;
}

message TensorShape {
  repeated int64 dims = 1;
}

message TensorProto {
  DataType dtype = 1;
  TensorShape shape = 2;
  repeated float float_val = 3;
  repeated int64 int64_val = 4;
  bytes raw_tensor_data = 5;
}

message ModelInferRequest {
  string model_name = 1;
  string model_version = 2;
  map<string, TensorProto> inputs = 3;
}

message ModelInferResponse {
  string model_name = 1;
  map<string, TensorProto> outputs = 2;
}

service InferenceServer {
  rpc ModelInfer (ModelInferRequest) returns (ModelInferResponse);
}
