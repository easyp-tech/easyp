syntax = "proto3";
package banking.ledger.v1;
import "google/protobuf/timestamp.proto";

enum AccountType {
  TYPE_UNSPECIFIED = 0;
  CHECKING = 1;
  SAVINGS = 2;
  CREDIT = 3;
}

message LedgerEntry {
  string entry_id = 1;
  string account_id = 2;
  int64 amount_cents = 3;
  string currency = 4;
  string memo = 5;
}

message Transaction {
  string tx_id = 1;
  string idempotency_key = 2;
  google.protobuf.Timestamp timestamp = 3;
  repeated LedgerEntry debit_entries = 4;
  repeated LedgerEntry credit_entries = 5;
}

service LedgerService {
  rpc PostTransaction (Transaction) returns (Transaction);
}
