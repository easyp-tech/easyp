syntax = "proto3";
package av.perception.v1;
import "google/protobuf/timestamp.proto";

message Point3D {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message TrackedObstacle {
  uint32 track_id = 1;
  string classification = 2;
  Point3D position = 3;
  Point3D velocity = 4;
  Point3D dimensions = 5;
  Quaternion orientation = 6;
  double confidence = 7;
}

message PerceptionFrame {
  uint64 frame_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  repeated TrackedObstacle obstacles = 3;
}

service PerceptionStreamer {
  rpc StreamPerception (PerceptionFrame) returns (stream PerceptionFrame);
}
