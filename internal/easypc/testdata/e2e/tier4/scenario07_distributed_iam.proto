syntax = "proto3";
package security.iam.v1;
import "google/protobuf/timestamp.proto";

message UserSubject {
  string user_id = 1;
  string email = 2;
  repeated string roles = 3;
  repeated string scopes = 4;
}

message AccessPolicy {
  string policy_id = 1;
  string resource_pattern = 2;
  repeated string allowed_actions = 3;
  string effect = 4;
}

message AuthTokenClaims {
  string issuer = 1;
  string subject = 2;
  repeated string audience = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp issued_at = 5;
  UserSubject user_data = 6;
}

service AuthTokenService {
  rpc ValidateToken (AuthTokenClaims) returns (UserSubject);
}
