syntax = "proto3";
package ecommerce.checkout.v1;
import "google/protobuf/timestamp.proto";

message Money {
  string currency_code = 1;
  int64 units = 2;
  int32 nanos = 3;
}

message CartItem {
  string sku = 1;
  string title = 2;
  int32 quantity = 3;
  Money unit_price = 4;
}

message PostalAddress {
  string street_address = 1;
  string city = 2;
  string state = 3;
  string postal_code = 4;
  string country = 5;
}

message Order {
  string order_id = 1;
  string customer_id = 2;
  repeated CartItem items = 3;
  PostalAddress shipping_address = 4;
  Money total_amount = 5;
  google.protobuf.Timestamp ordered_at = 6;
  string status = 7;
}

service OrderService {
  rpc SubmitOrder (Order) returns (Order);
}
