syntax = "proto3";
package telemetry.otel.v1;
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

message AttributeKeyValue {
  string key = 1;
  google.protobuf.Any value = 2;
}

message SpanEvent {
  google.protobuf.Timestamp time = 1;
  string name = 2;
  repeated AttributeKeyValue attributes = 3;
}

message Span {
  bytes trace_id = 1;
  bytes span_id = 2;
  bytes parent_span_id = 3;
  string name = 4;
  int32 kind = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
  repeated AttributeKeyValue attributes = 8;
  repeated SpanEvent events = 9;
}

message TraceBatch {
  string resource_service_name = 1;
  repeated Span spans = 2;
}

service TraceService {
  rpc ExportTraces (TraceBatch) returns (TraceBatch);
}
