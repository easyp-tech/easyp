syntax = "proto2";
package feat15.case05;
import "google/protobuf/descriptor.proto";

extend google.protobuf.MethodOptions {
  optional string auth_scope = 50005;
}

message EmptyReq {}
message EmptyResp {}

service SecuredService {
  rpc DoAction (EmptyReq) returns (EmptyResp) {
    option (auth_scope) = "admin:read";
  }
}
