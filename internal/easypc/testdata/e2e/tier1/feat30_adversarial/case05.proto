syntax = "proto3";
package feat30.case05;

message DeepNesting {
  message N1 {
    message N2 {
      message N3 {
        message N4 {
          message N5 {
            message N6 {
              string bottom = 1;
            }
            N6 n6 = 1;
          }
          N5 n5 = 1;
        }
        N4 n4 = 1;
      }
      N3 n3 = 1;
    }
    N2 n2 = 1;
  }
  N1 n1 = 1;
}
