// Kitchen sink test proto file
syntax = "proto3";

package test.kitchen.sink;

import "google/protobuf/descriptor.proto";

/* Multi-line
   block comment
   describing the message */
message TestMessage {
  string name = 1; // single-line comment
  int32 id = 2;
  repeated float scores = 3;

  enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_OK = 1;
    STATUS_ERROR = 2;
  }

  Status status = 4;
  map<string, string> attributes = 5;

  oneof test_oneof {
    string nickname = 6;
    int64 raw_bits = 0x10;
  }

  double ratio = 7 [default = 1.25e-3];
  bytes payload = 8 [custom_opt = "hello \n world \u0041"];
}
