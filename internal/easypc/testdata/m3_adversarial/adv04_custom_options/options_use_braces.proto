syntax = "proto2";
package adv04.client;

import "options_def.proto";

option (adv04.opt.opt_file_str) = "hello \"world\"\n\ttest";
option (adv04.opt.opt_file_int) = -42;
option (adv04.opt.opt_file_rep_int) = 10;
option (adv04.opt.opt_file_rep_int) = -20;
option (adv04.opt.opt_file_rep_int) = 30;
option (adv04.opt.opt_file_msg) = {
  name: "file_msg"
  code: 7
  tags: ["tagA", "tagB"]
  leaf: {
    flag: true
    ratio: 2.718281828
    note: "euler"
  }
};

message TestMessage {
  // Test descending tag order in source
  option (adv04.opt.opt_high_tag) = 999;
  option (adv04.opt.opt_low_tag) = 111;

  option (adv04.opt.opt_msg_scalars) = {
    f_int32: -12345
    f_int64: -9876543210
    f_uint32: 4000000000
    f_uint64: 18000000000000000000
    f_sint32: -500
    f_sint64: -60000
    f_fixed32: 3000000000
    f_fixed64: 12000000000000000000
    f_sfixed32: -123
    f_sfixed64: -456789
    f_float: 1.5
    f_double: -3.141592653589793
    f_bool: true
    f_string: "scalar_string"
    f_bytes: "bytes\x00\x01\x02\xff"
  };

  // Nested aggregate using angle brackets
  option (adv04.opt.opt_msg_angle) = {
    name: "angle_bracket"
    code: 99
    tags: [ "angle1", "angle2" ]
    leaf: {
      flag: false
      ratio: 0.5
      note: "nested_angle"
    }
  };

  // Repeated message options declared multiple times
  option (adv04.opt.opt_msg_rep_msg) = {
    name: "rep1"
    code: 101
    leaf: { flag: true ratio: 1.1 note: "first" }
  };
  option (adv04.opt.opt_msg_rep_msg) = {
    name: "rep2"
    code: 102
    tags: ["r1", "r2"]
    leaf: { flag: false ratio: 2.2 note: "second" }
  };

  option (adv04.opt.opt_msg_enum) = VAL_NEG_TEN;

  optional int32 test_field = 1 [
    (adv04.opt.opt_field_tag) = 777,
    (adv04.opt.opt_field_msg) = {
      name: "field_opt"
      code: 1
      leaf: { flag: true ratio: 9.99 }
    }
  ];

  oneof test_oneof {
    option (adv04.opt.opt_oneof_tag) = "my_oneof";
    int32 oneof_f1 = 2;
  }
}

enum TestEnum {
  option (adv04.opt.opt_enum_code) = 888;
  ZERO = 0;
  NEG = -1 [(adv04.opt.opt_enumval_code) = "neg_val"];
}

message WorkReq {
  optional string query = 1;
}

message WorkResp {
  optional int32 result_code = 1;
}

service TestService {
  option (adv04.opt.opt_svc_auth) = "admin";
  rpc DoWork(WorkReq) returns (WorkResp) {
    option (adv04.opt.opt_method_cost) = 15;
  }
}

message ExtTarget {
  extensions 100 to 200 [(adv04.opt.opt_extrange_label) = "allowed_range"];
}
