syntax = "proto3";
package shadow.lib.client;

import "pkg_shadow_lib.proto";

message ClientMsg {
  // Resolves to shadow.lib.tools.Tool via common prefix shadow.lib
  tools.Tool resolved_tool = 1;
}

message ShadowingMsg {
  message tools {
    message Tool {
      int32 shadowed_tool = 1;
    }
  }

  // MUST resolve to ShadowingMsg.tools.Tool
  tools.Tool local_shadowed_tool = 1;
}
