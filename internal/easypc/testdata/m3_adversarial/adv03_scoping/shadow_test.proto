syntax = "proto3";
package corp.client;

import "shadow_imported.proto";

message Target {
  int64 local_id = 1;
}

message Outer {
  message Target {
    bool is_nested = 1;
  }

  message Inner {
    // Should resolve to Outer.Target (closest enclosing lexical scope)
    Target nested_target = 1;
    // Explicitly qualified to package level
    corp.client.Target pkg_target = 2;
    // Explicitly qualified to remote package
    corp.common.Target remote_target = 3;
  }

  Target outer_target = 1;
  Inner inner_msg = 2;
}

message SiblingMsg {
  // Should resolve to corp.client.Target
  Target client_target = 1;
  corp.common.Another remote_another = 2;
}
