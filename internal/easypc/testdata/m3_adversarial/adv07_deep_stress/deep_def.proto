syntax = "proto2";
package adv07.deep;

import "google/protobuf/descriptor.proto";

message Level4 {
  optional int32 leaf_val = 1;
  optional string leaf_str = 2;
}

message Level3 {
  optional Level4 l4 = 1;
  optional string name = 2;
  repeated Level4 rep_l4 = 3;
}

message Level2 {
  optional Level3 l3 = 1;
  optional string name = 2;
  repeated Level3 rep_l3 = 3;
}

message Level1 {
  optional Level2 l2 = 1;
  optional string name = 2;
  repeated Level2 rep_l2 = 3;
}

message DeepContainer {
  optional Level1 l1 = 1;
  optional string name = 2;
}

message ExtremeScalars {
  optional fixed32 u32_min = 1;
  optional fixed32 u32_max = 2;
  optional sfixed32 i32_min = 3;
  optional sfixed32 i32_max = 4;
  optional sfixed32 i32_neg1 = 5;
  optional sfixed32 i32_zero = 6;
  optional fixed64 u64_min = 7;
  optional fixed64 u64_max = 8;
  optional sfixed64 i64_min = 9;
  optional sfixed64 i64_max = 10;
  optional sfixed64 i64_neg1 = 11;
  optional sfixed64 i64_zero = 12;

  optional int32 s_int32_min = 13;
  optional int32 s_int32_max = 14;
  optional int64 s_int64_min = 15;
  optional int64 s_int64_max = 16;
  optional sint32 s_sint32_min = 17;
  optional sint32 s_sint32_max = 18;
  optional sint64 s_sint64_min = 19;
  optional sint64 s_sint64_max = 20;
  optional uint32 s_uint32_max = 21;
  optional uint64 s_uint64_max = 22;
}

message ExtensibleMsg {
  optional string base_info = 1;
  extensions 100 to 1000;
}

extend ExtensibleMsg {
  optional int32 ext_int = 101;
  optional string ext_str = 102;
  optional ExtensibleMsg nested_ext = 103;
}

extend google.protobuf.FileOptions {
  optional DeepContainer deep_file_opt = 60001;
  optional ExtremeScalars extreme_file_opt = 60002;
  optional bool custom_file_bool = 60003;
}

extend google.protobuf.MessageOptions {
  optional DeepContainer deep_msg_opt = 61001;
  optional ExtremeScalars extreme_msg_opt = 61002;
  optional ExtensibleMsg extensible_msg_opt = 61003;
  optional bool custom_msg_bool = 61004;
}

extend google.protobuf.FieldOptions {
  optional DeepContainer deep_field_opt = 62001;
  optional ExtremeScalars extreme_field_opt = 62002;
  optional bool custom_field_bool = 62003;
  optional string custom_field_str = 62004;
}

extend google.protobuf.OneofOptions {
  optional string custom_oneof_str = 63001;
  optional int32 custom_oneof_int = 63002;
  optional DeepContainer deep_oneof_opt = 63003;
  optional bool custom_oneof_bool = 63004;
}

extend google.protobuf.EnumOptions {
  optional bool custom_enum_bool = 64001;
  optional string custom_enum_str = 64002;
}

extend google.protobuf.EnumValueOptions {
  optional bool custom_enumval_bool = 65001;
  optional int32 custom_enumval_int = 65002;
}

extend google.protobuf.ServiceOptions {
  optional bool custom_service_bool = 66001;
  optional string custom_service_str = 66002;
}

extend google.protobuf.MethodOptions {
  optional bool custom_method_bool = 67001;
  optional int32 custom_method_int = 67002;
}
