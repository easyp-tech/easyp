syntax = "proto2";
package adv07.deep;
import "deep_def.proto";

message OneofOptMsg {
  oneof choice_a {
    option (custom_oneof_str) = "choice_a_str";
    option (custom_oneof_int) = -99999;
    option (custom_oneof_bool) = false;
    option (deep_oneof_opt) = {
      name: "deep_oneof_container"
      l1: <
        name: "l1_oo"
        l2: {
          name: "l2_oo"
          l3: <
            name: "l3_oo"
            l4: { leaf_val: 12345 leaf_str: "oo_leaf" }
          >
        }
      >
    };

    int32 field_a1 = 1 [
      (custom_field_str) = "a1_str",
      (custom_field_bool) = false,
      deprecated = false
    ];
    string field_a2 = 2 [
      (custom_field_str) = "a2_str",
      deprecated = true
    ];
  }

  oneof choice_b {
    option (custom_oneof_str) = "choice_b_str";
    bool field_b1 = 3 [(custom_field_bool) = true];
  }
}
