syntax = "proto2";
package adv07.deep;
import "deep_def.proto";

message MixedDelimitersMsg {
  option (deep_msg_opt) = {
    name: "msg_brace_root"
    l1: <
      name: "msg_l1_angle"
      l2: {
        name: "msg_l2_brace"
        l3: <
          name: "msg_l3_angle"
          l4: {
            leaf_val: -999;
            leaf_str: "nested_mixed";
          };
          rep_l4: [
            < leaf_val: 1 leaf_str: "rep1" >,
            { leaf_val: 2 leaf_str: "rep2" },
            < leaf_val: 3; leaf_str: "rep3"; >
          ];
        >
        rep_l3: [
          { name: "rep_l3_a" },
          < name: "rep_l3_b" >
        ]
      }
    >
  };

  optional int32 field_with_angles = 1 [
    (deep_field_opt) = {
      name: "field_brace"
      l1: <
        name: "field_l1"
        l2: {
          name: "field_l2"
          l3: <
            l4: { leaf_val: 777 }
          >
        }
      >
    }
  ];

  optional string field_empty_aggregates = 2 [
    (deep_field_opt) = {
      l1: <
        l2: {}
      >
    }
  ];
}
