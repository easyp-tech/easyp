syntax = "proto2";
package adv08.stress;

import "iter3_def.proto";

option (opt_extreme_file) = {
  u32_min: 0
  u32_max: 4294967295
  sfix32_min: -2147483648
  sfix32_max: 2147483647
  sfix32_neg1: -1
  sfix32_zero: 0
  
  u64_min: 0
  u64_max: 18446744073709551615
  sfix64_min: -9223372036854775808
  sfix64_max: 9223372036854775807
  sfix64_neg1: -1
  sfix64_zero: 0

  i32_min: -2147483648
  i32_max: 2147483647
  i64_min: -9223372036854775808
  i64_max: 9223372036854775807

  s32_min: -2147483648
  s32_max: 2147483647
  s32_neg1: -1
  s32_zero: 0

  s64_min: -9223372036854775808
  s64_max: 9223372036854775807
  s64_neg1: -1
  s64_zero: 0

  u32_max_varint: 4294967295
  u64_max_varint: 18446744073709551615

  f_neg_zero: -0.0
  f_neg_small: -1.5e-10
  f_pos_small: 1.5e-10
  f_inf: inf
  f_neg_inf: -inf

  d_neg_zero: -0.0
  d_neg_small: -1.2345678901234567e-100
  d_inf: inf
  d_neg_inf: -inf

  status_neg: STATUS_NEG
};

message TestExtremeScalarsMsg {
  option (opt_extreme_msg) = {
    sfix32_min: -2147483648
    sfix32_neg1: -1
    sfix64_min: -9223372036854775808
    sfix64_neg1: -1
    s32_min: -2147483648
    s32_neg1: -1
    s64_min: -9223372036854775808
    s64_neg1: -1
    u64_max: 18446744073709551615
    u64_max_varint: 18446744073709551615
    f_neg_inf: -inf
    d_neg_inf: -inf
    status_neg: STATUS_NEG
  };

  optional int32 field_with_extreme_options = 1 [
    (opt_extreme_field) = {
      sfix32_min: -2147483648
      sfix64_min: -9223372036854775808
      s32_min: -2147483648
      s64_min: -9223372036854775808
    }
  ];

  oneof extreme_oneof {
    option (opt_extreme_oneof) = {
      s32_min: -2147483648
      s64_min: -9223372036854775808
    };
    int32 x = 2;
  }
}

enum EnumExtremeScalarsTest {
  option (opt_extreme_enum) = {
    sfix32_min: -2147483648
    sfix64_min: -9223372036854775808
    status_neg: STATUS_NEG
  };

  EXT_ZERO = 0;
  EXT_ONE = 1 [
    (opt_extreme_enumval) = {
      sfix32_neg1: -1
      s32_min: -2147483648
      s64_min: -9223372036854775808
    }
  ];
}

service ServiceExtremeTest {
  rpc MethodExtreme (TestExtremeScalarsMsg) returns (TestExtremeScalarsMsg) {
    option (opt_extreme_method) = {
      sfix32_min: -2147483648
      sfix64_min: -9223372036854775808
      s32_min: -2147483648
      s64_min: -9223372036854775808
    };
  }
}
