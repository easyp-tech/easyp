syntax = "proto2";
package adv08.stress.scoping.base;

message RootType {
  optional string name = 1;
}

message Parent {
  message SiblingA {
    message Leaf {
      optional int32 id = 1;
      optional string tag = 2;
    }
    optional Leaf leaf = 1;
  }

  message SiblingB {
    // Sibling lookup within Parent
    optional SiblingA.Leaf sibling_leaf = 1;
  }

  optional SiblingA a = 1;
  optional SiblingB b = 2;
}

message ExtendableTarget {
  optional string info = 1;
  extensions 100 to 200;
}
