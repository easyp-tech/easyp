syntax = "proto2";
package adv08.stress;

import "iter3_def.proto";

message TestBracketExtensionsMsg {
  option (opt_ext_msg) = {
    name: "root_extensible"
    code: 100

    // Bracketed extension with colon and brace
    [adv08.stress.ext_int32]: 12345
    
    // Bracketed extensions with negative scalar limits
    [adv08.stress.ext_sint32]: -2147483648
    [adv08.stress.ext_sint64]: -9223372036854775808
    [adv08.stress.ext_sfixed32]: -2147483648
    [adv08.stress.ext_sfixed64]: -9223372036854775808
    
    // Enum extension
    [adv08.stress.ext_status]: STATUS_NEG

    // Bracketed extension on submessage with omitted colon + brace
    [adv08.stress.ext_child] {
      name: "child_brace_no_colon"
      code: 201
      [adv08.stress.ext_str]: "child_level_1"

      // Submessage with omitted colon + angle brackets
      [adv08.stress.ext_child] <
        name: "child_angle_no_colon"
        code: 202
        [adv08.stress.ext_sint32]: -999
        
        // Deeper nested submessage with colon + angle brackets
        [adv08.stress.ext_child]: <
          name: "child_deep"
          code: 203
          [adv08.stress.ext_sint64]: -888
        >
      >
    }

    // Repeated bracketed extensions using list syntax with mixed delimiters
    [adv08.stress.ext_rep_child]: [
      { name: "rep_child_brace"; code: 301; },
      < name: "rep_child_angle", code: 302 >
    ]

    // Repeated bracketed extensions specified as repeated occurrences
    [adv08.stress.ext_rep_child] { name: "rep_child_occ1" }
    [adv08.stress.ext_rep_child] < name: "rep_child_occ2" >
  };

  optional int32 field_bracket_ext = 1 [
    (opt_ext_field) = {
      name: "field_ext"
      [adv08.stress.ext_sint32]: -2147483648
      [adv08.stress.ext_child] <
        name: "field_nested_ext"
        [adv08.stress.ext_sfixed64]: -9223372036854775808
      >
    }
  ];
}
