syntax = "proto3";
package adv05.methods;

message Req {
  string ping = 1;
}

message Resp {
  string pong = 1;
}

service EchoService {
  rpc M1_semi(Req) returns (Resp);
  rpc M2_empty(Req) returns (Resp) {}
  rpc M3_semi(Req) returns (Resp);
  rpc M4_opt(Req) returns (Resp) {
    option deprecated = true;
  }
  rpc M5_empty(Req) returns (Resp) {}
  rpc M6_comment_empty(Req) returns (Resp) {
    // Just a comment inside body
  }
}
