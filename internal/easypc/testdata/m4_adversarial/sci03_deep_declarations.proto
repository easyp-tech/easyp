syntax = "proto2";
package m4.adversarial.deep;

import "google/protobuf/descriptor.proto";

message CustomOptionDef {
  optional string author = 1;
  optional int32 version = 2;
  optional CustomOptionDef sub = 3;
}

extend google.protobuf.MessageOptions {
  optional CustomOptionDef msg_opt = 50001;
}

extend google.protobuf.FieldOptions {
  optional int32 field_opt = 50002;
}

extend google.protobuf.MethodOptions {
  optional CustomOptionDef method_opt = 50003;
}

// Level 1 Message
message Level1 {
  option (msg_opt) = {
    author: "Adversary"
    version: 42
    sub: {
      author: "NestedAuthor"
      version: 1
    }
  };

  // Level 2 Message
  message Level2 {
    // Level 3 Message
    message Level3 {
      // Level 4 Message
      message Level4 {
        // Level 5 Message
        message Level5 {
          optional string leaf_name = 1 [
            (field_opt) = 999,
            json_name = "customLeaf"
          ];
        }
        optional Level5 l5 = 1;
      }
      optional Level4 l4 = 1;
    }
    optional Level3 l3 = 1;
  }

  // Nested Enum
  enum NestedEnum {
    // Nested ZERO
    ZERO = 0;
    // Nested ONE
    ONE = 1;
  }

  // Oneof with options
  oneof test_choice {
    // Option on choice_a
    string choice_a = 1 [(field_opt) = 101];
    // Option on choice_b
    int32 choice_b = 2 [(field_opt) = 102];
  }

  extensions 100 to 200;
}

// Extension block
extend Level1 {
  optional string ext_field = 105;
}

service DeepService {
  rpc DeepMethod (Level1) returns (Level1) {
    option (method_opt) = {
      author: "ServiceAuthor"
      version: 99
    };
  }
}
