syntax = "proto3";
package m4.adversarial.comments;

// Detached file header comment 1

// Detached file header comment 2


// Leading comment on Message1
message Message1 { // Trailing on open brace of Message1
  // Leading on field1
  string field1 = 1; // Trailing on field1

  /* Multi-line leading
     block comment on field2 */
  int32 field2 = 2; /* Trailing block comment on field2 */

  // Comment before close brace of Message1
}

// Detached comment before Message2


// Leading comment on Message2
message Message2 {
  // Comment on line following brace with blank line after

  string field_a = 1;

  // Detached inside message

  // Leading on field_b
  int64 field_b = 2;
}

// Leading on Enum1
enum Enum1 { // Trailing on enum open brace
  // Leading on ZERO
  ENUM1_ZERO = 0; // Trailing on ZERO
  /* Block leading on ONE */
  ENUM1_ONE = 1;
}

// Leading on Service1
service Service1 { // Trailing on service brace
  // Leading on Rpc1
  rpc Rpc1 (Message1) returns (Message2); // Trailing on Rpc1
}
