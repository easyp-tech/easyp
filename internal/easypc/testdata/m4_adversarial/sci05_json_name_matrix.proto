syntax = "proto3";
package m4.adversarial.json_names;

message JsonNameMatrix {
  // Field with only json_name
  string field1 = 1 [json_name = "customField1"];

  // Field with other options before json_name
  int32 field2 = 2 [deprecated = false, json_name = "customField2"];

  // Field with other options after json_name
  bool field3 = 3 [json_name = "customField3", deprecated = true];

  message Nested {
    // Nested field with json_name
    string nested_field = 1 [json_name = "nestedCustom"];
  }

  Nested nested = 4;
}
