syntax = "proto3";
package audit.forensics.m2.base;

message BaseProbe {
  int32 id = 1;
  string name = 2;
  repeated string tags = 3;
  bytes payload = 4;
  optional bool flag = 5;
  map<string, int64> counts = 6;
  oneof choice {
    string choice_str = 7;
    int32 choice_num = 8;
  }
}

enum BaseStatus {
  UNKNOWN = 0;
  ACTIVE = 1;
  SUSPENDED = 2;
}
