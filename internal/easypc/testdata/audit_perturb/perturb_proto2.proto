syntax = "proto2";
package audit.forensics.m2.proto2_probe;

message Proto2Message {
  required int32 req_id = 1;
  optional string opt_str = 2 [default = "forensic_probe_default"];
  optional bool opt_flag = 3 [default = true];
  repeated int64 rep_nums = 4;

  optional group ProbeGroup = 5 {
    optional string group_name = 1;
    optional int32 group_code = 2;
  }

  extensions 100 to 200;
}
