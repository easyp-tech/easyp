# EasyP v1 policy — strict public API: every rule, wire+JSON compatibility.
# Usage: copy to your module root as easyp.yaml.
version: v1

linters:
  default: COMMENTS           # STANDARD + documentation on every entity
  enable:
    - UNARY_RPC               # no streaming RPCs
  allow_comment_ignores: false

linters-settings:
  ENUM_ZERO_VALUE_SUFFIX:
    suffix: _UNSPECIFIED
  SERVICE_SUFFIX:
    suffix: Service

breaking:
  baseline: git:main
  categories: [FILE, WIRE_JSON]
