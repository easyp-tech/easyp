# EasyP v1 generation — remote plugins (nothing to install locally), gRPC-Gateway + OpenAPI.
# Usage: copy as easyp.gen.yaml. Remote plugins require a pinned `version`.
# Requires googleapis and grpc-gateway in protobuf.mod (see protobuf-example.mod).
version: v1

generate:
  managed:
    enabled: true
    override:
      - file_option: go_package_prefix
        value: github.com/acme/contracts/gen/go   # change to your module

plugins:
  - remote: plugins.beta.easyp.tech/protocolbuffers/go
    version: v1.36.11
    out: gen/go
    opts:
      paths: source_relative
  - remote: plugins.beta.easyp.tech/grpc/go
    version: v1.6.2
    out: gen/go
    opts:
      paths: source_relative
      require_unimplemented_servers: false
  - remote: plugins.beta.easyp.tech/grpc-ecosystem/gateway
    version: v2.29.0
    out: gen/go
    opts:
      paths: source_relative
  - remote: plugins.beta.easyp.tech/grpc-ecosystem/openapiv2
    version: v2.29.0
    out: gen/openapi
