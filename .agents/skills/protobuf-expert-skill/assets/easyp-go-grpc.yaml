# EasyP v1 policy — typical Go + gRPC API module.
# Usage: copy to your module root as easyp.yaml.
# Pair with easyp.gen-go-grpc.yaml (generation) and protobuf-example.mod (module + deps).
version: v1

linters:
  default: STANDARD
  enable:
    - COMMENTS

linters-settings:
  ENUM_ZERO_VALUE_SUFFIX:
    suffix: _UNSPECIFIED
  SERVICE_SUFFIX:
    suffix: Service

breaking:
  baseline: git:main
  categories: [FILE]
  ignore_unstable: true       # v1alpha1 / v1beta1 packages may change freely
