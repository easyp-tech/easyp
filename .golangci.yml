version: "2"
linters:
  enable:
    - staticcheck
  exclusions:
    rules:
      # Exported callee labels are required by .spec/agent-rules.md.
      # Keep ST1005 for capitalized sentences; only identifier-style wrappers
      # such as fmt.Errorf("Open: %w", err) are exempt.
      - linters: [staticcheck]
        text: '^ST1005:'
        source: 'fmt\.Errorf\("[A-Z][A-Za-z0-9_]*: '
