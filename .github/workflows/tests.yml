name: tests

on:
  push:
    branches:
      - 'main'
      - 'v1.0'
  pull_request:
    branches:
      - '*'

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TestAcceptanceGates builds the ratified v1.0 baseline oracle from commit
      # 1e9a596 and fails (never skips) when it is absent. The default shallow
      # checkout does not contain it, so fetch it explicitly by full SHA
      # (upload-pack rejects shortened SHA wants).
      - name: Fetch acceptance baseline oracle (TestAcceptanceGates)
        run: git fetch --no-tags --depth=1 origin 1e9a5965517058787411a0d5b77dbbeb7d556f44

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare test.
        run: task init

      - name: Lint Go sources
        run: task lint:go

      - name: Cross-compile Linux ARM release binaries
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build ./cmd/easyp ./cmd/easyp-mcp

      - name: Start test.
        run: task test

      - name: Validate native v1 repository example
        run: task proto:check

      - name: Validate developer task dispatch
        run: task dev-tools:check

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          install-only: true

      - name: Validate nightly release configuration
        run: goreleaser check
