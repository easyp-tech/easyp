name: "v1 Nightly Release"
on:
  push:
    tags:
      # v1 stays opt-in after the branch is merged into main.
      - 'v1.0.0-nightly.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and source branch
        run: bash scripts/validate-release-tag.sh "$GITHUB_REF_NAME"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean --timeout=90m
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_AUTH_TOKEN }}
